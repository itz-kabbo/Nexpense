name: Feature request
description: Suggest a focused improvement to Nexpense.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Nexpense is an offline-first personal expense tracker. Please describe how the suggestion fits that goal.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or workflow that is currently difficult.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approach that could address the same problem?
